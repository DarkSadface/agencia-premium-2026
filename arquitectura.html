<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Diseño Zaha Hadid</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.0.3/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.0.3/dist/fonts/geist-mono/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #f4f4f4;
            --accent: #d4d4d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg); 
            color: var(--fg); 
            font-family: 'Geist Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            overflow-x: hidden;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.05;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
        }

        /* BRUTALIST GRID & LINES */
        .grid-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: space-between;
        }
        .grid-line {
            width: 1px;
            height: 100%;
            background: rgba(128,128,128,0.25);
        }

        .container {
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 2vw;
            display: flex;
            justify-content: space-between;
            z-index: 50;
            mix-blend-mode: difference;
            text-transform: uppercase;
            font-size: 1vw;
            letter-spacing: -0.02em;
        }

        /* HERO SECTION */
        .hero {
            height: 150vh; /* Extra height for parallax */
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-img-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 120%;
            z-index: -1;
            will-change: transform, opacity;
        }
        .hero-img-container img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.2);
        }

        /* GIANT TYPOGRAPHY */
        .giant-text-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            mix-blend-mode: difference;
        }
        
        .giant-text {
            font-size: 15vw;
            line-height: 0.75;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: -0.05em;
            color: var(--fg);
            will-change: transform, opacity;
            mix-blend-mode: difference;
            position: relative;
            z-index: 50;
        }
        
        .text-left { transform: translateX(-10vw); }
        .text-right { transform: translateX(10vw); }

        /* CONTENT SECTION */
        .content-section {
            padding: 15vw 5vw;
            position: relative;
            background: var(--bg);
            z-index: 2;
        }

        .brutalist-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10vw;
            margin-bottom: 20vw;
            align-items: end;
            transition: all 0.3s ease;
        }
        
        .brutalist-block:hover {
            text-shadow: 0 0 20px rgba(128,128,128,0.3);
        }

        .brutalist-block:nth-child(even) {
            grid-template-columns: 1.5fr 1fr;
            direction: rtl;
        }
        .brutalist-block:nth-child(even) > * {
            direction: ltr;
        }

        .block-number {
            font-size: 8vw;
            line-height: 1;
            color: transparent;
            -webkit-text-stroke: 1px var(--fg);
        }

        .block-text {
            font-size: 3vw;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -0.03em;
            max-width: 800px;
            will-change: transform, opacity;
        }
        .block-desc {
            font-size: 1vw;
            font-weight: 400;
            margin-top: 2vw;
            color: var(--accent);
            max-width: 400px;
        }

        /* ASYMMETRICAL IMAGES */
        .floating-img {
            position: absolute;
            width: 30vw;
            height: 40vw;
            object-fit: cover;
            filter: grayscale(100%);
            z-index: 0;
            opacity: 0.5;
            will-change: transform, opacity;
        }
        .img-1 { top: -10vw; right: 5vw; }
        .img-2 { top: 40vw; left: 10vw; width: 40vw; height: 25vw; }

        /* FOOTER */
        footer {
            padding: 5vw;
            background: var(--fg);
            color: var(--bg);
            font-size: 10vw;
            line-height: 0.8;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            text-align: center;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="grid-overlay">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <header>
        <div>Z/H Studio</div>
        <div>Parametric Future</div>
    </header>

    <div class="container">
        <section class="hero">
            <div class="hero-img-container" data-speed="0.5">
                <img src="assets/hero_arquitectura.jpg" alt="Architecture">
            </div>
            <div class="giant-text-container">
                <h1 class="giant-text text-left">Parametric</h1>
                <h1 class="giant-text text-right">Form</h1>
            </div>
        </section>

        <section class="content-section">
            <img src="assets/hero_inmobiliaria.jpg" class="floating-img img-1" data-speed="1.2">
            <img src="assets/hero_arquitectura.jpg" class="floating-img img-2" data-speed="0.8">
            
            <div class="brutalist-block">
                <div class="block-number">01</div>
                <div>
                    <div class="block-text">Defying Gravity<br>And Orthodoxy</div>
                    <div class="block-desc">We bend concrete to our will. The straight line is a limitation we refuse to accept.</div>
                </div>
            </div>

            <div class="brutalist-block">
                <div class="block-number">02</div>
                <div>
                    <div class="block-text">Fluid Spatial<br>Dynamics</div>
                    <div class="block-desc">Architecture must flow like water, adapting to the user while shaping their experience.</div>
                </div>
            </div>
        </section>

        <footer>
            Shape<br>Tomorrow
        </footer>
    </div>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Extreme Parallax for Background Image
        gsap.to(".hero-img-container", {
            yPercent: 30,
            ease: "none",
            scrollTrigger: {
                trigger: ".hero",
                start: "top top",
                end: "bottom top",
                scrub: true
            }
        });

        // Giant Typography Opposing Scroll
        gsap.to(".text-left", {
            x: "5vw",
            scrollTrigger: {
                trigger: ".hero",
                start: "top top",
                end: "bottom top",
                scrub: 1
            }
        });
        
        gsap.to(".text-right", {
            x: "-5vw",
            scrollTrigger: {
                trigger: ".hero",
                start: "top top",
                end: "bottom top",
                scrub: 1
            }
        });

        // Floating Images Parallax
        const floatingImgs = document.querySelectorAll('.floating-img');
        floatingImgs.forEach(img => {
            const speed = img.getAttribute('data-speed');
            gsap.to(img, {
                y: 200 * speed,
                ease: "none",
                scrollTrigger: {
                    trigger: ".content-section",
                    start: "top bottom",
                    end: "bottom top",
                    scrub: true
                }
            });
        });

        // Reveal Blocks
        const blocks = document.querySelectorAll('.brutalist-block');
        blocks.forEach(block => {
            gsap.from(block.querySelector('.block-text'), {
                y: 100,
                opacity: 0,
                duration: 1.5,
                ease: "power4.out",
                scrollTrigger: {
                    trigger: block,
                    start: "top 80%"
                }
            });
        });
    </script>
</body>
</html>
